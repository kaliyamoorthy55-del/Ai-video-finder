
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Download repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Install Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 4. Extract Android project ZIP
      - name: Extract Android project
        shell: bash
        run: |
          mkdir -p project

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository root"
            ls -lah
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"

          unzip -o "$ZIP_FILE" -d project

          if [ ! -f project/app/build.gradle.kts ]; then
            echo "ERROR: app/build.gradle.kts not found"
            find project -maxdepth 4 -type f
            exit 1
          fi

      # 5. Configure Java and Kotlin JVM targets
      - name: Fix Java and Kotlin JVM targets
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          p = Path("project/app/build.gradle.kts")

          if not p.exists():
              sys.exit("ERROR: app/build.gradle.kts not found")

          s = p.read_text()

          match = re.search(r'\bandroid\s*\{', s)

          if not match:
              sys.exit("ERROR: Android block not found")

          start = s.find("{", match.start())
          depth = 0
          end = -1

          for i in range(start, len(s)):
              if s[i] == "{":
                  depth += 1
              elif s[i] == "}":
                  depth -= 1
                  if depth == 0:
                      end = i
                      break

          if end == -1:
              sys.exit("ERROR: Invalid Android block")

          block = s[start + 1:end]

          java_options = """compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }"""

          kotlin_options = """kotlinOptions {
                  jvmTarget = "17"
              }"""

          def update_block(content, name, replacement):
              pattern = rf'{name}\s*\{{[^{{}}]*\}}'

              if re.search(pattern, content):
                  return re.sub(
                      pattern,
                      lambda m: replacement,
                      content,
                      count=1
                  )

              return "\n    " + replacement + "\n" + content

          block = update_block(
              block,
              "compileOptions",
              java_options
          )

          block = update_block(
              block,
              "kotlinOptions",
              kotlin_options
          )

          s = s[:start + 1] + block + s[end:]

          p.write_text(s)

          print("Java target: 17")
          print("Kotlin target: 17")
          print("Gradle configuration updated successfully")
          PY

      # 6. Configure Android SDK
      - name: Configure Android SDK
        shell: bash
        run: |
          echo "sdk.dir=$ANDROID_HOME" > project/local.properties
          echo "Android SDK configured"

      # 7. Build APK
      - name: Build APK
        working-directory: project
        run: |
          gradle clean assembleDebug

      # 8. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Video-Finder-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
