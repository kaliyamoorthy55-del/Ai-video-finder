      - name: Fix Java and Kotlin versions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("project/app/build.gradle.kts")
          s = p.read_text()

          if "compileOptions" not in s:
              s = s.replace(
                  "android {",
                  """android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }""",
                  1
              )
          else:
              s = re.sub(
                  r"sourceCompatibility\s*=\s*JavaVersion\.\w+",
                  "sourceCompatibility = JavaVersion.VERSION_17", s
              )
              s = re.sub(
                  r"targetCompatibility\s*=\s*JavaVersion\.\w+",
                  "targetCompatibility = JavaVersion.VERSION_17", s
              )

          if "kotlinOptions" not in s:
              s = s.rstrip()[:-1] + """
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          """
          else:
              s = re.sub(
                  r'jvmTarget\s*=\s*"[^"]+"',
                  'jvmTarget = "17"', s
              )

          p.write_text(s)
          print(s)
          PY
          - name: Fix Java and Kotlin versions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("project/app/build.gradle.kts")
          s = p.read_text()

          if "sourceCompatibility" not in s:
              s = s.replace(
                  "android {",
                  """android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }""",
                  1
              )

          p.write_text(s)
          print("Java and Kotlin targets updated to 17")
          PY
          run: |
          mkdir -p project
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" -print -quit)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository root"
            ls -lah
            exit 1
          fi
          echo "Found ZIP: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d project


      - name: Configure Android SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > project/local.properties
          echo "Android SDK: $ANDROID_HOME"

      - name: Build APK
        run: |
          cd project
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Video-Finder-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
