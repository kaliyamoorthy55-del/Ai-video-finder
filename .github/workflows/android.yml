
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      
      - name: Extract Android project
        run: |
          mkdir -p project

          echo "Searching for ZIP files..."
          find . -maxdepth 1 -type f -iname "*.zip" -print

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found"
            ls -lah
            exit 1
          fi

          echo "Found: $ZIP_FILE"
          unzip -t "$ZIP_FILE"
          unzip -o "$ZIP_FILE" -d project

      - name: Configure Android SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > project/local.properties
          echo "Android SDK: $ANDROID_HOME"

      - name: Build APK
        run: |
          cd project
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Video-Finder-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
